apiVersion: serving.knative.dev/v1
kind: Service
metadata:
    name: $SERVICE_NAME
    labels:
        cloud.googleapis.com/location: $GCP_CLOUD_RUN_REGION
    annotations:
        run.googleapis.com/launch-stage: GA
        run.googleapis.com/ingress: all
        run.googleapis.com/minScale: "$MIN_INSTANCES"
        run.googleapis.com/maxScale: "1"
spec:
    template:
        metadata:
            annotations:
                run.googleapis.com/cpu-throttling: "true"
        spec:
            serviceAccountName: richpods-server@$GOOGLE_CLOUD_PROJECT.iam.gserviceaccount.com
            containerConcurrency: 90
            containers:
                - image: $IMAGE
                  ports:
                      - name: http1
                        containerPort: 4000
                  resources:
                      limits:
                          cpu: "1"
                          memory: 512Mi
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: GOOGLE_CLOUD_PROJECT
                        value: $GOOGLE_CLOUD_PROJECT
                      - name: GCS_BUCKET_NAME
                        value: $GCS_BUCKET_NAME
                      - name: GCS_TRANSCRIPT_BUCKET_NAME
                        value: $GCS_TRANSCRIPT_BUCKET_NAME
                      - name: GCS_UPLOAD_BUCKET_NAME
                        value: $GCS_UPLOAD_BUCKET_NAME
                      - name: GCS_HOSTED_BUCKET_NAME
                        value: $GCS_HOSTED_BUCKET_NAME
                      - name: CORS_ALLOWED_ORIGINS
                        value: $CORS_ALLOWED_ORIGINS
                      - name: API_BASE_URL
                        value: $API_BASE_URL
                      - name: WEBSITE_HOSTED_PODCAST_URL_PATTERN
                        value: $WEBSITE_HOSTED_PODCAST_URL_PATTERN
                      - name: FIREBASE_API_KEY
                        value: $FIREBASE_API_KEY
                      - name: GENAI_TASKS_FUNCTION_URL
                        value: $GENAI_TASKS_FUNCTION_URL
                      - name: GENAI_TASKS_QUEUE
                        value: $GENAI_TASKS_QUEUE
                      - name: CLOUD_TASKS_INVOKER_SA
                        value: $CLOUD_TASKS_INVOKER_SA
                      - name: GEMINI_MAX_FILE_SIZE
                        value: "$GEMINI_MAX_FILE_SIZE"
                      - name: GEMINI_MAX_AUDIO_LENGTH
                        value: "$GEMINI_MAX_AUDIO_LENGTH"
                      - name: POSTMARK_FROM_EMAIL
                        value: $POSTMARK_FROM_EMAIL
                      - name: POSTMARK_SERVER_TOKEN
                        valueFrom:
                            secretKeyRef:
                                key: latest
                                name: $POSTMARK_SECRET_NAME
    traffic:
        - percent: 100
          latestRevision: true
