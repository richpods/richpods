fragment UserFields on User {
    id
    publicName
    biography
    website
    publicEmail
    socialAccounts
    usedQuotaBytes
    totalQuotaBytes
}

fragment CurrentUserFields on User {
    id
    publicName
    biography
    website
    publicEmail
    socialAccounts
    editorLanguage
    role
    usedQuotaBytes
    totalQuotaBytes
}

fragment RichPodFields on RichPod {
    id
    title
    description
    state
    createdAt
    updatedAt
    isHosted
    hostedEpisodeId
    explicit
    aiAudioEligible
    editor {
        ...UserFields
    }
}

fragment EnclosureFields on Enclosure {
    __typename
    ... on Markdown {
        title
        text
        links {
            label
            url
        }
    }
    ... on InteractiveChart {
        title
        description
        chartFormat
        chart
    }
    ... on GeoMap {
        title
        description
        geoJSON
    }
    ... on Slideshow {
        title
        description
        slides {
            imageUrl
            imageAlt
            caption
            credit
        }
    }
    ... on Poll {
        coloeus {
            endpoint
            pollId
        }
    }
    ... on Card {
        title
        cardType
        visibleAsChapter
        url
        openGraph {
            ogTitle
            ogDescription
            ogImageUrl
            ogImageWidth
            ogImageHeight
            mimeType
            resourceSize
        }
        description
        coverSource
        coverImageUrl
        quoteText
        citationSource
        citationUrl
        imageUrl
        imageAlt
        imageLink
    }
}

fragment ChapterFields on Chapter {
    begin
    enclosure {
        ...EnclosureFields
    }
}

fragment TranscriptFields on Transcript {
    language
    summary
    segments {
        begin
        end
        text
        speaker
    }
}

fragment ChapterGenerationStatusFields on ChapterGenerationStatus {
    state
    error
    updatedAt
    canRegenerate
    suggestions {
        begin
        enclosure {
            ...EnclosureFields
        }
    }
}
